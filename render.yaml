# Blueprint de Render: API de Django (Docker) + frontend React (sitio estático). Plan gratuito.
# La base de datos es Postgres en Supabase, así que aquí no se crea ninguna.
services:
  - type: web
    name: english-lab-api
    runtime: docker
    plan: free
    healthCheckPath: /api/salud/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_HTTPS
        value: "1"
      # Supabase > Connect > Session pooler (con la contraseña real, sin corchetes).
      - key: DATABASE_URL
        sync: false
      # URL pública del sitio estático, por ejemplo https://english-lab.onrender.com (sin barra final).
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      # Lo mismo, para que el /admin acepte formularios desde el dominio del API.
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      # Opcional: crea un administrador al arrancar si ambos están definidos.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: english-lab
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # URL pública del API, por ejemplo https://english-lab-api.onrender.com (sin barra final).
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router resuelve las rutas en el navegador: toda URL debe devolver index.html.
      - type: rewrite
        source: /*
        destination: /index.html
